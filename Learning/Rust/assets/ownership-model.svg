<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="100%" font-family="ui-monospace, Menlo, Consolas, monospace">
  <!-- Stack -->
  <rect x="30" y="60" width="220" height="180" rx="10" fill="none" stroke="#888" stroke-width="2"/>
  <text x="140" y="45" text-anchor="middle" font-size="16" fill="#888">STACK</text>
  <rect x="60" y="90" width="160" height="110" rx="6" fill="none" stroke="#4a9" stroke-width="2"/>
  <text x="140" y="115" text-anchor="middle" font-size="15" fill="#4a9">s</text>
  <text x="140" y="140" text-anchor="middle" font-size="14" fill="#888">ptr ──▶</text>
  <text x="140" y="162" text-anchor="middle" font-size="14" fill="#888">len = 2</text>
  <text x="140" y="184" text-anchor="middle" font-size="14" fill="#888">cap = 2</text>
  <!-- Heap -->
  <rect x="390" y="105" width="200" height="80" rx="6" fill="none" stroke="#e6b450" stroke-width="2"/>
  <text x="490" y="90" text-anchor="middle" font-size="16" fill="#e6b450">HEAP</text>
  <rect x="420" y="130" width="60" height="34" rx="4" fill="none" stroke="#e6b450" stroke-width="2"/>
  <text x="450" y="152" text-anchor="middle" font-size="14" fill="#e6b450">h</text>
  <rect x="500" y="130" width="60" height="34" rx="4" fill="none" stroke="#e6b450" stroke-width="2"/>
  <text x="530" y="152" text-anchor="middle" font-size="14" fill="#e6b450">i</text>
  <!-- Arrow -->
  <path d="M 220 132 C 290 132, 320 147, 415 147" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="415,142 427,147 415,152" fill="#888"/>
  <!-- Caption -->
  <text x="320" y="275" text-anchor="middle" font-size="14" fill="#888">s owns the heap buffer: drop(s) frees it — exactly once</text>
</svg>
