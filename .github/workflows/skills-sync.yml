name: skills-sync

# The harness skill directories (.agents/.claude/.windsurf) are generated
# from skills/ by scripts/sync-skills.mjs. Fail if someone edits skills/
# without re-syncing, or edits a generated copy directly.

on:
  push:
    branches: [main]
    paths: ["skills/**", "scripts/sync-skills.mjs", ".github/workflows/skills-sync.yml"]
  # No paths filter here on purpose: `check` is a required status check, and a
  # path-filtered workflow never reports that context on PRs outside its paths
  # — their merge box hangs on "Expected — Waiting for status to be reported"
  # forever. On PRs that touch none of those paths this job still runs; it just
  # passes quickly (nothing to sync) and reports the required context.
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # drift auto-fix commits to PR branches
    steps:
      - uses: actions/checkout@v4
        with:
          # PR events: check out the PR's own branch. The default is a detached
          # merge commit — git push from it fails. Push events: empty → default ref.
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-sync harness skill directories
        run: node scripts/sync-skills.mjs

      # PRs from this repo: the bot commits the synced copies to the PR
      # branch so nobody ever has to run the sync locally. The push
      # re-triggers the checks on the fixed commit.
      - name: Auto-fix drift (PRs from this repo)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "in sync — nothing to fix"
            exit 0
          fi
          git commit -m "chore: sync generated skill copies (bot)"
          if ! git push; then
            echo "::error::Drift detected, and the bot could not push the fix (branch updates may be restricted)."
            echo "::error::Run locally: node scripts/sync-skills.mjs — commit and push again."
            exit 1
          fi
          echo "::notice::Generated copies were out of sync — the bot committed the fix to this PR branch."

      # Main pushes and fork PRs: no write access — fail with the fix command.
      - name: Fail on drift (main pushes and forks)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          git config user.name "drift-check"
          git add -A
          git diff --cached --exit-code || {
            echo "::error::skills/ and the harness copies are out of sync."
            echo "::error::Run: node scripts/sync-skills.mjs — then commit."
            exit 1
          }

      - name: Smoke test — the skills CLI discovers all three skills
        run: |
          OUT=$(npx -y skills@latest add . --list --yes)
          echo "$OUT"
          for s in agent-tutor agent-tutor-review agent-tutor-visualize; do
            echo "$OUT" | grep -q "$s" || { echo "::error::$s not discovered by the skills CLI"; exit 1; }
          done
          echo "all 3 skills discovered"
